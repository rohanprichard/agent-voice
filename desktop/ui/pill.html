<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' wss://api.elevenlabs.io; media-src 'self' blob:" />
    <title>talktome call</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="pill.css" />
  </head>
  <body>
    <!-- The window is transparent and lets clicks through, except on the
         capsule and the transcript. The capsule grows out from under the
         menu bar when a call starts, and goes back when it ends. -->
    <main id="surface" data-state="idle" data-transcript="closed">
      <div id="capsule" aria-hidden="true"></div>

      <!-- Ringing asks a different question from a live call, so it has its
           own controls. -->
      <div id="ringing" class="layer" role="group" aria-label="Incoming call">
        <span class="bell" aria-hidden="true">
          <span class="bell-pulse"></span>
          <svg viewBox="0 0 24 24">
            <path d="M18 8.5a6 6 0 1 0-12 0c0 6.5-2.5 8.5-2.5 8.5h17S18 15 18 8.5" />
            <path d="M13.7 20.5a2 2 0 0 1-3.4 0" />
          </svg>
        </span>
        <span class="ring-text">
          <span id="ring-name" class="name">A session</span>
          <span id="ring-hint" class="hint">wants to talk</span>
        </span>
        <button id="decline" class="round" type="button" aria-label="Decline the call" title="Decline">
          <svg viewBox="0 0 24 24">
            <path d="M12 7c4.54 0 8.66 1.78 11.71 4.68a1 1 0 0 1 0 1.41l-2.48 2.48a1 1 0 0 1-1.41 0 12.3 12.3 0 0 0-2.66-1.85c-.33-.16-.56-.51-.56-.9v-3.1A15.6 15.6 0 0 0 12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85a1 1 0 0 1-1.41 0L.29 13.09a1 1 0 0 1 0-1.41C3.34 8.78 7.46 7 12 7Z" />
          </svg>
        </button>
        <button id="accept" class="round" type="button" aria-label="Answer the call" title="Answer">
          <svg viewBox="0 0 24 24">
            <path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85a1 1 0 0 1-1.41 0L.29 13.09a1 1 0 0 1 0-1.41C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.68a1 1 0 0 1 0 1.41l-2.48 2.48a1 1 0 0 1-1.41 0 12.3 12.3 0 0 0-2.66-1.85c-.33-.16-.56-.51-.56-.9v-3.1C15.15 9.25 13.6 9 12 9Z" />
          </svg>
        </button>
      </div>

      <div id="pill" class="layer" role="toolbar" aria-label="Call controls">
        <button id="mute" class="pbtn" type="button" aria-label="Mute microphone" aria-pressed="false" title="Mute microphone">
          <span class="icon">
            <svg id="mic-on" viewBox="0 0 24 24">
              <rect x="9" y="2" width="6" height="11" rx="3" />
              <path d="M5.75 11a6.25 6.25 0 0 0 12.5 0" />
              <path d="M12 17.25V21" />
            </svg>
            <svg id="mic-off" viewBox="0 0 24 24" hidden>
              <rect x="9" y="2" width="6" height="11" rx="3" />
              <path d="M5.75 11a6.25 6.25 0 0 0 12.5 0" />
              <path d="M12 17.25V21" />
              <path d="M3.75 3.75 20.25 20.25" />
            </svg>
          </span>
        </button>

        <span id="identity">
          <span id="call-name" class="name">talktome</span>
          <span id="call-status" class="status" role="status" aria-live="polite">Connecting…</span>
        </span>

        <span id="threads"><canvas id="canvas" aria-hidden="true"></canvas></span>

        <span class="divider" aria-hidden="true"></span>

        <button id="interrupt" class="pbtn" type="button" aria-label="Stop the reply" title="Stop the reply" disabled>
          <span class="icon">
            <svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" /></svg>
          </span>
        </button>

        <button id="transcript-toggle" class="pbtn" type="button" aria-label="Transcript" aria-expanded="false" title="Transcript">
          <span class="icon">
            <svg viewBox="0 0 24 24">
              <rect x="5" y="3" width="14" height="18" rx="2.5" />
              <path d="M8.5 8h7M8.5 12h7M8.5 16h4" />
            </svg>
          </span>
        </button>

        <button id="end" class="pbtn" type="button" aria-label="End the call" title="End">
          <span class="icon">
            <!-- The handset laid down, which people read as "hang up". -->
            <svg viewBox="0 0 24 24">
              <path d="M12 7c4.54 0 8.66 1.78 11.71 4.68a1 1 0 0 1 0 1.41l-2.48 2.48a1 1 0 0 1-1.41 0 12.3 12.3 0 0 0-2.66-1.85c-.33-.16-.56-.51-.56-.9v-3.1A15.6 15.6 0 0 0 12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85a1 1 0 0 1-1.41 0L.29 13.09a1 1 0 0 1 0-1.41C3.34 8.78 7.46 7 12 7Z" />
            </svg>
          </span>
        </button>
      </div>

      <section id="transcript" aria-label="Transcript">
        <header>
          <span class="t-title">Transcript</span>
          <button id="transcript-close" type="button" aria-label="Close the transcript">
            <svg viewBox="0 0 16 16"><path d="M3.5 3.5 12.5 12.5M12.5 3.5 3.5 12.5" /></svg>
          </button>
        </header>
        <ol id="t-list"></ol>
        <p id="t-empty">Nothing said yet.</p>
        <div id="choices"></div>
        <p id="t-note" hidden></p>
      </section>
    </main>
    <script src="../build/ui/dom.js"></script>
    <script src="../build/ui/threads.js"></script>
    <script src="../build/ui/voice.js"></script>
    <script src="../build/ui/pill.js"></script>
  </body>
</html>
