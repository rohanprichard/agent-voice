<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calls</title>
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/calls.css" />
    <script type="module" src="/calls.js"></script>
  </head>
  <body>
    <main>
      <header class="calls-header">
        <h1>Calls</h1>
        <button id="clear-history" class="secondary-button" type="button" disabled>Clear history</button>
      </header>
      <div id="calls-alert" class="calls-alert" role="alert" hidden>
        <p id="calls-alert-text"></p>
        <button id="calls-alert-terminal" class="secondary-button" type="button" hidden>Open in Terminal</button>
      </div>
      <ul id="calls-list" class="calls-list" aria-label="Recent calls"></ul>
      <div id="calls-empty" class="calls-empty" hidden>
        <p class="calls-empty-title">No calls yet</p>
        <p>When an agent calls you, the call shows here.</p>
      </div>
      <footer class="calls-footer">
        <p id="calls-transcripts"></p>
        <p id="calls-claude-note" hidden>
          A Claude Code call back runs Claude without a terminal. Claude denies a
          tool that needs permission, unless your Claude settings allow it.
        </p>
      </footer>
    </main>
  </body>
</html>
