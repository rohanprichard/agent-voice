name: talktome
label: TalkToMe
kind: platform
version: 0.1.0
description: >
  Voice calls with Hermes through the TalkToMe desktop app.
  The agent rings the user's Mac with the talktome_call tool. After the user
  answers, each spoken turn arrives as a message in the session that placed the
  call, and each reply is spoken on the Mac. The Mac keeps the microphone and
  speech. The plugin runs on the Mac that runs TalkToMe.
author: Rohan Richard
provides_tools:
  - talktome_call
  - talktome_end
optional_env:
  - name: TALKTOME_COMMAND
    description: "Path to the talktome command (default: talktome on PATH, then ~/.local/bin/talktome)"
    prompt: "talktome command"
    password: false
