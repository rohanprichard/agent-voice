name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # The hub test runs the real talktome-server from server/.venv.
      - run: uv sync --frozen
        working-directory: server
      - run: npm test

  server:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uvx ruff check src tests
      - run: uvx ruff format --check src tests
      - run: uv run pytest -q
      # The package a user installs must start, with its plugin files inside.
      - name: Install the wheel the way users do
        run: |
          uv build --wheel
          uv tool install dist/*.whl
          talktome-server version
          talktome-server hosts > /dev/null
