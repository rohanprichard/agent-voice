name: Release

# A v* tag builds the app and publishes a GitHub release with it. A tag with
# a dash, such as v0.2.0-beta.1, is marked as a pre-release. Run it by hand
# from the Actions tab to build and test without a release: the disk image is
# then kept as a workflow artifact for a few days.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The version is in three files. A tag that does not match all of them
      # stops the release before anything is built.
      - name: Check that the tag matches the version
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app=$(node -p "require('./package.json').version")
          server=$(sed -n 's/^version = "\(.*\)"/\1/p' server/pyproject.toml)
          package=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' server/src/talktome_server/__init__.py)
          echo "tag $tag, app $app, server $server, package $package"
          [ "$tag" = "$app" ] && [ "$tag" = "$server" ] && [ "$tag" = "$package" ]

      - run: npm ci
      - name: Install the Electron binary
        run: test -d node_modules/electron/dist || node node_modules/electron/install.js
      - run: uv sync --frozen
        working-directory: server
      # A release is built only from code that passes the same checks as CI.
      - run: npm test
      - run: npm run build:app
      - run: codesign --verify --deep --strict dist/app/mac-arm64/talktome.app

      - uses: actions/upload-artifact@v4
        with:
          name: talktome-app
          path: dist/app/*.dmg

      - name: Write the Homebrew cask values
        if: github.ref_type == 'tag'
        run: |
          dmg=$(ls dist/app/*.dmg)
          {
            echo "### Homebrew cask"
            echo '```ruby'
            echo "version \"${GITHUB_REF_NAME#v}\""
            echo "sha256 \"$(shasum -a 256 "$dmg" | cut -d' ' -f1)\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Only the disk image. The zip and latest-mac.yml come back with in-app updates.
          files: dist/app/*.dmg
