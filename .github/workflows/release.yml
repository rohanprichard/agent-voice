name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  app:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The version is in three files. A tag that does not match all of them
      # stops the release before anything is built.
      - name: Check that the tag matches the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app=$(node -p "require('./package.json').version")
          server=$(sed -n 's/^version = "\(.*\)"/\1/p' server/pyproject.toml)
          package=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' server/src/talktome_server/__init__.py)
          echo "tag $tag, app $app, server $server, package $package"
          [ "$tag" = "$app" ] && [ "$tag" = "$server" ] && [ "$tag" = "$package" ]

      - run: npm ci
      - name: Install the Electron binary
        run: test -d node_modules/electron/dist || node node_modules/electron/install.js
      - run: uv sync --frozen
        working-directory: server
      # A release is built only from code that passes the same checks as CI.
      - run: npm test
      - run: npm run build:app
      - run: codesign --verify --deep --strict dist/app/mac-arm64/talktome.app

      - name: Write the Homebrew cask values
        run: |
          dmg=$(ls dist/app/*.dmg)
          {
            echo "### Homebrew cask"
            echo '```ruby'
            echo "version \"${GITHUB_REF_NAME#v}\""
            echo "sha256 \"$(shasum -a 256 "$dmg" | cut -d' ' -f1)\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/app/*.dmg
            dist/app/*.zip
            dist/app/latest-mac.yml

  # PyPI trusts this workflow through trusted publishing, so no token is
  # stored. It is off until the owner sets up the trusted publisher on PyPI and
  # sets the repository variable PUBLISH_PYPI to true.
  server:
    if: vars.PUBLISH_PYPI == 'true'
    needs: app
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
        working-directory: server
      - run: uv run pytest -q
        working-directory: server
      - run: uv build
        working-directory: server
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: server/dist
