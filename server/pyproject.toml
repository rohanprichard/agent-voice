[project]
name = "talktome-server"
version = "0.2.0"
description = "The agent side of talktome voice calls: run it where your coding agents run."
readme = "README.md"
license = "MIT"
authors = [{ name = "Rohan Richard" }]
requires-python = ">=3.11"
dependencies = ["mcp>=1.9,<2"]

[project.scripts]
talktome-server = "talktome_server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talktome_server"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
