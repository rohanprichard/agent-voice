[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "talktome-local"
version = "0.1.0"
description = "Voice calls with the coding agent you already use. A macOS menu-bar app."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rohan Richard" }]
requires-python = ">=3.11,<3.14"
# The desktop app's voice server needs the speech extra.
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "platformdirs>=4,<5",
  "websockets>=13,<16",
]

[project.optional-dependencies]
speech = [
  "faster-whisper>=1.2,<2",
  "huggingface-hub>=0.28,<1",
  "kokoro-onnx>=0.4.9,<0.7",
  "keyring>=25,<26",
]

[project.urls]
Homepage = "https://github.com/rohanprichard/talktome"
Issues = "https://github.com/rohanprichard/talktome/issues"

[project.scripts]
talktome = "talktome.cli:main"

[dependency-groups]
dev = [
    "talktome-local[speech]",
    "pyinstaller>=6.22.3",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/talktome"]

[tool.hatch.build.targets.wheel.force-include]
"skills/talktome/SKILL.md" = "talktome/skills/talktome/SKILL.md"

# The rest of the repository is the desktop app, which has no place in the package.
[tool.hatch.build.targets.sdist]
include = ["/src/talktome", "/skills/talktome", "/tests", "/LICENSE", "/NOTICE", "/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
